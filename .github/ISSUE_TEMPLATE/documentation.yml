name: Documentation Update
description: Suggest improvements to the README, code comments, or contribution guides.
title: "[Docs]: <Topic>"
labels: ["documentation", "good-first-issue"]
body:
  - type: textarea
    id: target
    attributes:
      label: What needs documenting?
      description: Identify which file or code section needs better explanation.
      placeholder: The mathematical formulas in `lrLogic.ts` could use a clearer inline comment explaining OLS.
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Assignment
      options:
        - label: I am ready to submit a Pull Request to fix this myself.
          required: false