# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  
  # Targeted instructions based on which folders the contributor touches
  path_instructions:
    - path: "src/algorithms/implemented/**"
      instructions: |
        - Ensure the new algorithm strictly implements the `AlgorithmBlueprint` interface from `src/algorithms/base.ts`.
        - Verify that all mathematical calculations in `nextStep` are pure functions and do not mutate the previous state directly.
        - Check that the SVG coordinate math makes sense. Remind contributors that the Y-axis is inverted in SVG (0 is at the top).
        - Ensure the ML Metrics (interpretability, speed, data hunger) accurately reflect the real-world properties of the algorithm.
        
    - path: "src/components/**"
      instructions: |
        - Flag this file with a warning if the PR is adding a new algorithm. Remind the contributor that they should only be adding files to `src/algorithms/implemented/` unless this is explicitly a UI enhancement.
        
    - path: "src/context/**"
      instructions: |
        - Flag this file immediately. Contributors should not modify the global state orchestrator unless they are fixing a core architectural bug.